name: Build and Publish to TestPyPI

on:
  push:
    tags:
      # Test release tags for TestPyPI validation
      - test-*

jobs:
  security-check:
    name: Security check
    runs-on: ubuntu-latest
    steps:
      - name: Check repository owner
        if: github.repository_owner != github.actor
        run: |
          echo "Error: Only repository owner can trigger this workflow"
          exit 1

  osv-scan:
    name: OSV Scan
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: ./.github/workflows/osv-scan.yml

  build:
    name: Build package
    needs: [security-check, osv-scan]
    uses: ./.github/workflows/build-package.yml

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.package-built == 'true'
    environment: testpypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
      contents: read

    steps:
      - name: Download built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      # - name: Set up uv
      #   uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
      #   with:
      #     version: ">=0.9.12"
      #     enable-cache: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # attestations: true  # PEP740 attestations (enabled by default)

      # - name: Publish to TestPyPI by uv >= 0.9.12
      #   run: uv publish --publish-url https://test.pypi.org/legacy/
