name: OSV Scan

on:
  workflow_call:

jobs:
  osv-scan:
    if: github.repository_owner == github.actor
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read # Required to upload SARIF file to CodeQL
      security-events: write # Require writing security events to upload SARIF file to security tab
      contents: read # Only need to read contents
    with:
      scan-args: "--lockfile=uv.lock ."
